[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finemed-ai"
version = "0.1.0"
description = "AI-powered data warehouse and analytics system for Finemed Pharma ERP data"
requires-python = ">=3.10"

dependencies = [
    # ETL / data
    "pandas>=2.2",
    "pyarrow>=17.0",
    "python-dotenv>=1.0",
    "dbfread>=2.0",

    # Database
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",

    # Data validation / models
    "pydantic>=2.9",

    # LLM
    "anthropic>=0.40",

    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",

    # Automation
    "schedule>=1.2",
]

[project.optional-dependencies]

forecasting = [
    "torch>=2.2",
    "chronos-forecasting>=1.0",
]

dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

all = [
    "torch>=2.2",
    "chronos-forecasting>=1.0",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]