services:
  finemed-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: finemed-pharmaai

    ports:
      - "8000:8000"

    env_file:
      - .env.production

    environment:
      PYTHONPATH: /app/src
      DEMAND_FILE: /app/data/04_silver/demand_forecasting/daily_demand.parquet
      FORECAST_DIR: /app/data/05_gold/demand_forecasting/production_forecasts
      LATEST_FORECAST_FILE: /app/data/05_gold/demand_forecasting/production_forecasts/latest.parquet
      RUN_STATUS_FILE: /app/data/run_status.json

    volumes:
      - ./data:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

networks:
  default:
    name: finemed_pharmaai_network