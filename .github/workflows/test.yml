name: Tests & Deployment Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow pydantic fastapi "uvicorn[standard]" httpx pytest anthropic python-multipart python-dotenv sqlalchemy psycopg2-binary schedule dbfread
          pip install -e . --no-deps

      - name: Run unit, integration & failure test matrix
        env:
          CLIENT_API_KEY: FinemedAI_2026
          ADMIN_TOKEN: FinemedAI2026
        run: pytest tests/ -v

      - name: Run automated deployment verification
        env:
          CLIENT_API_KEY: FinemedAI_2026
          ADMIN_TOKEN: FinemedAI2026
        run: python scripts/verify_deployment.py

  docker-verification:
    name: Production Container Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: pip install httpx

      - name: Build production Docker image
        run: docker build -t finemed-ai:prod .

      - name: Launch production container
        run: |
          docker run -d \
            --name finemed-prod-container \
            -p 8000:8000 \
            -e CLIENT_API_KEY=FinemedAI_2026 \
            -e ADMIN_TOKEN=FinemedAI2026 \
            -e ENVIRONMENT=production \
            -e GIT_COMMIT=${{ github.sha }} \
            finemed-ai:prod
          sleep 5

      - name: Verify live container health & readiness endpoints
        run: |
          curl -f http://127.0.0.1:8000/health
          curl -f http://127.0.0.1:8000/ready
          curl -f http://127.0.0.1:8000/version

      - name: Run live container verification suite
        env:
          CLIENT_API_KEY: FinemedAI_2026
          ADMIN_TOKEN: FinemedAI2026
        run: python scripts/verify_deployment.py