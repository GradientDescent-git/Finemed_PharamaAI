name: Tests & Deployment Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow pydantic fastapi "uvicorn[standard]" httpx pytest anthropic python-multipart python-dotenv sqlalchemy psycopg2-binary schedule dbfread
          pip install -e . --no-deps

      - name: Run unit, integration & failure test matrix
        run: pytest tests/ -v

      - name: Run automated deployment verification
        run: python scripts/verify_deployment.py